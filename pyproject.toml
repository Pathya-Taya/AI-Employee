[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-employee"
version = "0.1.0"
description = "Fictional local company sandbox and composable business tools"
requires-python = ">=3.11,<3.12"
dependencies = [
    "langchain-groq==1.1.3",
    "python-dotenv==1.2.4",
    "langchain-core==1.6.9",
    "pydantic==2.14.1",
    "langgraph==1.2.14",
]

[project.optional-dependencies]
test = ["pytest==9.1.1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ai_employee = ["policies/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
